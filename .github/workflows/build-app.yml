name: Build APP

on:
  workflow_dispatch:

  push:
    branches:
      - master
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          log-accepted-android-sdk-licenses: 'false'
          # Do NOT add "tools" here: the legacy Android SDK Tools package was
          # removed from Google's repository, and sdkmanager aborts the whole
          # step on an unknown package. platform-tools is what is actually needed.
          packages: 'platform-tools cmake;3.31.5 platforms;android-35 ndk;28.0.13004108'

      - name: Build APK
        run: ./gradlew :app:assembleRelease

      - name: display dir tree
        run: |
          set -o pipefail
          set -ex
          sudo tree --filelimit 20 || true

      - uses: actions/upload-artifact@v4
        name: Upload APK
        with:
          name: App bundle
          path: app/build/outputs/apk/release/app-release.apk

      # 打 tag 时的版本号必须与 app/build.gradle 中声明的一致
      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "build.gradle versionName: $VERSION_NAME"
          echo "git tag: ${GITHUB_REF_NAME}"
          if [ "$VERSION_NAME" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match versionName $VERSION_NAME"
            exit 1
          fi

      # 仅在打 tag 时发布 GitHub Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true